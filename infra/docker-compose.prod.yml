# =============================================================================
# Production stack for a single VPS (lihat .claude/rules/deployment.md).
# Bring up with:
#   docker compose -f infra/docker-compose.prod.yml --env-file /etc/eak/.env up -d
# Secrets live in /etc/eak/.env with mode 0600, never in the image.
# =============================================================================
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eakpromosi}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eak}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eak]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [eak]

  migrate:
    image: eak-api:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: /etc/eak/.env
    command: ['node', '-e', "require('child_process').execSync('npx prisma migrate deploy', { stdio: 'inherit' })"]
    networks: [eak]

  api:
    image: eak-api:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: /etc/eak/.env
    restart: unless-stopped
    networks: [eak]

  worker:
    image: eak-worker:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: /etc/eak/.env
    restart: unless-stopped
    deploy:
      replicas: 1
    networks: [eak]

  web:
    image: eak-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [eak]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - api
      - web
    networks: [eak]

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  eak:
    driver: bridge
